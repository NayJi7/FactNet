[project]
name = "factnet"
version = "0.1.0"
description = "Social media misinformation detection: NLP classifier, propagation graph, and account influence scoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "transformers>=4.40",
    "datasets>=2.19",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "streamlit>=1.36",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factnet"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
