# Reverse proxy for the dashboard.
#
#   sudo cp deploy/nginx/factnet.conf /etc/nginx/sites-available/factnet
#   sudo ln -s /etc/nginx/sites-available/factnet /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot rewrite the TLS block:
#   sudo certbot --nginx -d factnet.example.org
#
# Replace factnet.example.org throughout, and 8347 if you changed the port.

# A reading occupies a worker for several seconds, so a burst of them from one
# address is worth slowing down. 20 per minute is far above what a person does
# and far below what hurts.
limit_req_zone $binary_remote_addr zone=factnet_api:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=factnet_page:10m rate=120r/m;

upstream factnet {
    server 127.0.0.1:8347;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name factnet.example.org;

    # certbot writes its challenge here; everything else goes to TLS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # the two-argument form: `http2 on;` is nginx 1.25 and later, and Ubuntu
    # 24.04 ships 1.24, where it fails the config test outright. This is
    # deprecated on newer builds but accepted by both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name factnet.example.org;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/factnet.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/factnet.example.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # the page loads no third-party anything, so the policy can be strict.
    # 'unsafe-inline' on styles is what the bundler emits; scripts do not need it.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;
    client_max_body_size 2m;          # a pasted cascade, not a file upload

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/factnet.access.log;
    error_log  /var/log/nginx/factnet.error.log warn;

    # ---- the streaming endpoint, which needs nginx to get out of the way
    # Server-Sent Events: buffering here would hold every stage until the last
    # one, which is exactly the behaviour the streaming was written to avoid.
    location = /api/verdict/stream {
        limit_req zone=factnet_api burst=5 nodelay;
        proxy_pass http://factnet;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        include /etc/nginx/proxy_params;
    }

    # ---- the rest of the API
    # a live Bluesky fetch takes about 15 seconds and a large cascade about 8,
    # so the read timeout has to be generous or the proxy cuts a good request
    location /api/ {
        limit_req zone=factnet_api burst=10 nodelay;
        proxy_pass http://factnet;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        include /etc/nginx/proxy_params;
    }

    # ---- the page and its assets
    location / {
        limit_req zone=factnet_page burst=40 nodelay;
        proxy_pass http://factnet;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/proxy_params;
    }

    # the bundler fingerprints these, so they can be cached hard
    location /assets/ {
        proxy_pass http://factnet;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/proxy_params;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
